name: Production Dataset Test & Security Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark httpx bandit pip-audit

      # Tool 1: SCA Gate (Generates audit report)
      - name: Run Software Composition Analysis (SCA)
        continue-on-error: true
        run: |
          echo "Scanning dependencies for known CVEs..."
          pip-audit --desc

      # Tool 2: SAST Gate (Generates AST security report)
      - name: Run Static Application Security Testing (SAST)
        run: |
          echo "Running Bandit AST security analysis..."
          bandit -r . -ll --exit-zero

      # Tool 3 & 4: Functional, DAST & SLA Performance Verification
      - name: Execute Automated Test Suite (Functional, DAST & SLAs)
        run: |
          pytest -v --tb=short test_automated_suite.py
